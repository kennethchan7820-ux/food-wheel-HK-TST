<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>今日食乜好？菜系輪盤</title>
<style>
:root{
  --bg1:#fff6e2; --bg2:#ffe7c9; --ink:#3b2b20; --muted:#8a7360;
  --card:#fffdf8; --rim:#e0a13a; --rim2:#b9761d;
  --btn1:#ffb52e; --btn2:#f0871c; --btnsh:#c2661a;
  --shadow:0 18px 45px rgba(109,61,29,.18);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
  background:radial-gradient(circle at 50% 0%,var(--bg1),var(--bg2) 70%);
  min-height:100vh;color:var(--ink);overflow-x:hidden;
}
.wrap{max-width:720px;margin:0 auto;padding:22px 16px 48px;text-align:center}

/* ---------- 可編輯標題 ---------- */
.title-row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
h1#title{
  font-size:clamp(26px,6.5vw,38px);margin:4px 0;font-weight:900;letter-spacing:.5px;
  padding:4px 14px;border-radius:14px;border:2px dashed transparent;
  outline:none;min-width:120px;cursor:text;transition:background .2s,border-color .2s;
}
h1#title:hover{border-color:#e6c48a}
h1#title:focus{background:#fff;border-color:var(--rim);box-shadow:0 4px 14px rgba(0,0,0,.08)}
.edit-tip{font-size:12px;color:var(--muted);margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px;font-size:14px}

/* ---------- 卡片 ---------- */
.card{background:var(--card);border-radius:28px;padding:20px 16px 24px;box-shadow:var(--shadow)}
.stage{display:inline-flex;gap:6px;align-items:center;background:#fff1d6;color:#9a5f14;
  font-weight:800;font-size:13px;padding:6px 14px;border-radius:999px;margin-bottom:6px}

/* ---------- 輪盤 ---------- */
.wheel-wrap{position:relative;width:min(88vw,440px);aspect-ratio:1;margin:10px auto 6px}
.pointer{
  position:absolute;left:50%;top:-6px;transform:translateX(-50%);z-index:6;
  width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;
  border-top:34px solid #e23b3b;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35));
}
.pointer::after{content:"";position:absolute;left:-10px;top:-20px;width:20px;height:20px;
  border-radius:50%;background:#e23b3b;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.wheel-outer{
  position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,#f3c46a,#fff3d4,#e0a13a,#fff3d4,#f3c46a);
  padding:10px;box-shadow:0 14px 34px rgba(0,0,0,.22),0 0 0 4px #c98a24 inset;
  transition:box-shadow .3s,filter .3s;
}
.wheel-outer.spinning{filter:saturate(1.18) brightness(1.04);box-shadow:0 14px 40px rgba(0,0,0,.28),0 0 34px #ffc44d}
.bulbs{position:absolute;inset:0;pointer-events:none;z-index:4}
.bulb{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;
  background:#fff8dc;box-shadow:0 0 6px #ffd473,0 0 2px #b9761d}
.wheel-outer.spinning .bulb{animation:blink .45s linear infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
svg#wheel{width:100%;height:100%;display:block;border-radius:50%;background:#fff}
#rotor{transform-origin:200px 200px;transition:transform 260ms cubic-bezier(.4,0,.6,1)}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;
  width:22%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#fffbef,#ffe9bd);
  border:5px solid var(--rim);font-size:clamp(22px,6vw,32px);
  box-shadow:0 5px 14px rgba(0,0,0,.25)}

/* ---------- 結果 ---------- */
.result-box{margin:14px 0 4px;min-height:86px;display:grid;place-items:center;gap:4px}
#result{font-size:clamp(26px,7vw,38px);font-weight:900;color:#a8391a;line-height:1.25}
#hint{color:var(--muted);font-size:14px;min-height:20px}
.pop{animation:pop .9s cubic-bezier(.18,.9,.3,1.3)}
@keyframes pop{
  0%{transform:scale(.3) rotate(-8deg);opacity:0}
  50%{transform:scale(1.28) rotate(3deg);opacity:1}
  70%{transform:scale(.9) rotate(-2deg)}
  85%{transform:scale(1.07)}
  100%{transform:scale(1) rotate(0);opacity:1}
}

/* ---------- 按鈕 ---------- */
.actions{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:6px}
button{
  border:0;border-radius:999px;padding:15px 30px;font-size:18px;font-weight:900;font-family:inherit;
  background:linear-gradient(180deg,var(--btn1),var(--btn2));color:#fff;cursor:pointer;
  box-shadow:0 5px 0 var(--btnsh);transition:transform .12s,box-shadow .12s,opacity .2s;
}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--btnsh)}
button:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:#7a5a46;box-shadow:0 4px 0 #543c2d;font-size:14px;padding:10px 20px}
button.small{font-size:13px;padding:9px 16px;background:#6d4c41;box-shadow:0 3px 0 #4a332b;font-weight:700}
.audio{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:18px;
  padding-top:14px;border-top:1px dashed #e8d6bb}
.audio label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
input[type=range]{width:110px;accent-color:var(--rim2)}

/* ---------- 歷史 ---------- */
.history{margin-top:16px;font-size:13px;color:var(--muted);text-align:left}
.history b{color:var(--ink)}
.history ul{margin:6px 0 0;padding-left:18px}

/* ---------- 彩紙 ---------- */
.confetti{position:fixed;top:-24px;z-index:99;pointer-events:none;will-change:transform,opacity}
@keyframes fall{
  0%{transform:translate3d(0,0,0) rotate(0);opacity:1}
  100%{transform:translate3d(var(--dx),108vh,0) rotate(var(--rot));opacity:0}
}
@media(prefers-reduced-motion:reduce){
  #rotor{transition-duration:800ms!important}
  .confetti{display:none}
}
</style>
</head>
<body>
<div class="wrap">

  <p class="edit-tip">✏️ 標題可以直接㩒落去改</p>
  <div class="title-row"><h1 id="title" contenteditable="true" spellcheck="false">🎡 今日食乜好？</h1></div>
  <p class="sub">18 種全球菜系 × 每種 10 道料理 — 先抽菜系，再抽料理</p>

  <div class="card">
    <div class="stage" id="stage">第一輪 🎡 菜系輪盤</div>

    <div class="wheel-wrap">
      <div class="pointer"></div>
      <div class="wheel-outer" id="outer">
        <svg id="wheel" viewBox="0 0 400 400" aria-hidden="true"><g id="rotor"></g></svg>
        <div class="bulbs" id="bulbs"></div>
      </div>
      <div class="hub" id="hub">🍴</div>
    </div>

    <div class="result-box">
      <div id="result">準備好未？</div>
      <div id="hint">㩒下面粒掣，先抽一個菜系</div>
    </div>

    <div class="actions">
      <button id="spin">🎡 抽菜系</button>
      <button id="foodSpin" style="display:none">🍽️ 抽具體料理</button>
      <button id="reset" class="ghost" style="display:none">↺ 重新嚟過</button>
    </div>

    <div class="audio">
      <button id="musicBtn" class="small">🎵 開背景音樂</button>
      <button id="soundBtn" class="small">🔊 轉動音效：開</button>
      <label>音量 <input id="volume" type="range" min="0" max="100" value="40"></label>
    </div>

    <div class="history" id="history" style="display:none"><b>今日抽過：</b><ul id="historyList"></ul></div>
  </div>
</div>

<script>
/* ============================================================
   資料：18 個全球菜系 × 每個 10 道料理
   ============================================================ */
const CUISINES = [
 {flag:"🇭🇰",name:"港式",dishes:["燒鵝飯","雲吞麵","煲仔飯","乾炒牛河","菠蘿油配奶茶","避風塘炒蟹","缽仔焗飯","豉油雞","車仔麵","煎釀三寶"]},
 {flag:"🇹🇼",name:"台式",dishes:["牛肉麵","滷肉飯","鹽酥雞","蚵仔煎","三杯雞","滷味拼盤","臭豆腐","大腸麵線","排骨飯","胡椒餅"]},
 {flag:"🇨🇳",name:"中菜",dishes:["小籠包","北京填鴨","麻婆豆腐","宮保雞丁","水煮魚","回鍋肉","酸辣湯","東坡肉","擔擔麵","蔥油餅"]},
 {flag:"🇯🇵",name:"日式",dishes:["壽司","豚骨拉麵","日式燒肉","日式咖喱","親子丼","天婦羅","烏冬","吉列豬扒","章魚燒","鰻魚飯"]},
 {flag:"🇰🇷",name:"韓式",dishes:["韓式燒肉","韓式炸雞","部隊鍋","石鍋拌飯","韓式冷麵","泡菜鍋","辣炒年糕","海鮮煎餅","韓式炸醬麵","人參雞湯"]},
 {flag:"🇹🇭",name:"泰式",dishes:["泰式炒河","青咖喱","冬蔭功","打拋豬飯","月亮蝦餅","泰式炒飯","咖喱蟹","清蒸檸檬魚","泰式船麵","芒果糯米飯"]},
 {flag:"🇻🇳",name:"越式",dishes:["越南牛肉河","越式法包","越式春卷","檬粉","越式咖喱雞","蔗蝦","越式煎餅","酸辣魚湯","生牛肉河","越式燒肉飯"]},
 {flag:"🇸🇬",name:"星馬",dishes:["海南雞飯","肉骨茶","叻沙","炒粿條","沙嗲串燒","辣椒螃蟹","咖央多士","椰漿飯","福建蝦麵","囉喏 Rojak"]},
 {flag:"🇮🇳",name:"印度",dishes:["牛油雞咖喱","坦都里烤雞","印度飛餅","比爾亞尼飯","羊肉咖喱","菠菜芝士咖喱","咖喱角","鷹嘴豆咖喱","馬薩拉魚","芒果拉昔"]},
 {flag:"🇮🇹",name:"意式",dishes:["薄餅 Pizza","意大利粉","意式燴飯","千層麵","焗通心粉","意式肉丸","意式海鮮麵","佛卡夏","燉牛膝","提拉米蘇"]},
 {flag:"🇫🇷",name:"法式",dishes:["法式燉雞","法式洋蔥湯","可麗餅","法式鹹批","紅酒燉牛肉","焗田螺","油封鴨腿","牛扒薯條","尼斯沙律","馬賽魚湯"]},
 {flag:"🇪🇸",name:"西班牙",dishes:["西班牙海鮮飯","西班牙薯仔蛋餅","Tapas 拼盤","蒜香蝦","伊比利火腿","烤乳豬","番茄凍湯","炸魷魚圈","西班牙燉海鮮","吉拿棒"]},
 {flag:"🇬🇷",name:"希臘",dishes:["Gyros 卷餅","慕莎卡","希臘沙律","Souvlaki 烤串","炭燒羊架","希臘烤魚","Pita 配酸乳酪醬","希臘肉丸","檸檬烤雞","果仁蜜餅"]},
 {flag:"🇹🇷",name:"土耳其",dishes:["旋轉烤肉","土耳其薄餅 Pide","Adana 烤串","土耳其肉丸","鷹嘴豆蓉","釀青椒","土耳其燉羊肉","土耳其早餐","Lahmacun","土耳其軟糖"]},
 {flag:"🕌",name:"中東",dishes:["沙威瑪","法拉費","鷹嘴豆蓉配薄餅","Kebab 烤串","Tabbouleh 沙律","釀葡萄葉","羊肉手抓飯","蒜蓉烤雞","茄子蓉","Shakshuka"]},
 {flag:"🇲🇽",name:"墨西哥",dishes:["Taco","Burrito","Quesadilla","Nachos","Enchilada","Fajitas","墨西哥飯","牛油果醬配脆片","Churros","墨西哥燉豬肉"]},
 {flag:"🇺🇸",name:"美式",dishes:["漢堡","美式炸雞","熱狗","西冷牛扒","美式厚批","BBQ 燒肋排","芝士通粉","美式早餐","水牛城雞翼","龍蝦卷"]},
 {flag:"🥗",name:"健康輕食",dishes:["沙律碗","藜麥雞胸飯","三文魚溫沙律","雞肉卷餅","越式米紙卷","蔬果冰沙碗","烤雜菜配藜麥","希臘乳酪碗","蕎麥冷麵","雞胸意粉"]}
];

const $ = s => document.querySelector(s);
const rotor = $("#rotor"), outer = $("#outer");
let rotation = 0, busy = false, picked = null, history = [];

/* ============================================================
   可編輯標題（記住上次改嘅名）
   ============================================================ */
(function(){
  const t = $("#title");
  try{ const saved = localStorage.getItem("wheelTitle"); if(saved) t.textContent = saved; }catch(e){}
  t.addEventListener("input", ()=>{ try{ localStorage.setItem("wheelTitle", t.textContent.trim()); }catch(e){} });
  t.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); t.blur(); } });
  t.addEventListener("blur", ()=>{ if(!t.textContent.trim()) t.textContent = "🎡 今日食乜好？"; });
})();

/* ============================================================
   畫輪盤（SVG 扇形 + 放射狀文字）
   ============================================================ */
const CX = 200, CY = 200, R = 196, R_IN = 66, R_TXT_OUT = 186;

function pt(deg, r){ const a = (deg - 90) * Math.PI / 180; return [CX + r*Math.cos(a), CY + r*Math.sin(a)]; }

// 自動縮字：長名唔會爆出輪盤外
function fitFont(label, n){
  const base = n > 14 ? 16 : (n > 10 ? 18.5 : 20.5);
  const span = R_TXT_OUT - R_IN - 6;               // 可用半徑長度
  let units = 0;
  for(const ch of String(label)){
    units += /[一-鿿　-〿＀-￯]/.test(ch) ? 1
           : (ch === " " ? .34 : (/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{1F1E6}-\u{1F1FF}]/u.test(ch) ? .62 : .56));
  }
  return Math.max(10.5, Math.min(base, span / Math.max(units, 1)));
}

function drawWheel(labels){
  const n = labels.length, step = 360 / n;
  let svg = "";
  for(let i=0;i<n;i++){
    const a0 = i*step, a1 = (i+1)*step, mid = a0 + step/2;
    const [x0,y0] = pt(a0,R), [x1,y1] = pt(a1,R);
    const large = step > 180 ? 1 : 0;
    const hue = Math.round(i * (360/n));
    const fill = `hsl(${hue} 68% ${i%2 ? 46 : 57}%)`;
    svg += `<path d="M${CX},${CY} L${x0.toFixed(2)},${y0.toFixed(2)} A${R},${R} 0 ${large},1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${fill}" stroke="rgba(255,255,255,.75)" stroke-width="1.6"/>`;
    // 放射狀文字：下半圈翻轉 180° 以免倒轉難讀
    const rMid = (R_IN + R_TXT_OUT) / 2;
    const flip = (mid > 180 && mid < 360) ? ` rotate(180 ${(CX+rMid).toFixed(2)} ${CY})` : "";
    const fs = fitFont(labels[i], n);
    svg += `<text transform="rotate(${(mid-90).toFixed(3)} ${CX} ${CY})${flip}" x="${(CX+rMid).toFixed(2)}" y="${CY}" `
        +  `text-anchor="middle" dominant-baseline="central" font-size="${fs}" font-weight="800" fill="#fff" `
        +  `style="paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:3px;font-family:inherit">`
        +  esc(labels[i]) + `</text>`;
  }
  svg += `<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="3"/>`;
  rotor.innerHTML = svg;
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// 燈泡
(function(){
  const b = $("#bulbs");
  for(let i=0;i<24;i++){
    const a = i*(360/24)*Math.PI/180, el = document.createElement("i");
    el.className = "bulb";
    el.style.left = (50 + 48.5*Math.sin(a)) + "%";
    el.style.top  = (50 - 48.5*Math.cos(a)) + "%";
    el.style.animationDelay = (i*0.035)+"s";
    b.appendChild(el);
  }
})();

const cuisineLabels = CUISINES.map(c => c.flag + " " + c.name);
drawWheel(cuisineLabels);

/* ============================================================
   音效 / 音樂（Web Audio，無需外部檔案）
   ============================================================ */
let ac=null, master=null, musicGain=null, sfxGain=null, soundOn=true, musicOn=false, musicTimer=null, mStep=0;

function initAudio(){
  if(!ac){
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = ($("#volume").value)/100; master.connect(ac.destination);
    musicGain = ac.createGain(); musicGain.gain.value = .55; musicGain.connect(master);
    sfxGain  = ac.createGain(); sfxGain.gain.value = 1;    sfxGain.connect(master);
  }
  if(ac.state === "suspended") ac.resume();
}
function tone(freq, dur=.08, type="sine", gain=.05, delay=0, dest){
  if(!ac) return;
  const t = ac.currentTime + delay;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(.0001, t);
  g.gain.linearRampToValueAtTime(gain, t + .012);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(dest || sfxGain);
  o.start(t); o.stop(t + dur + .03);
}
function tick(){ if(soundOn) tone(1180, .035, "square", .05); }
function winSound(){
  if(!ac) return;
  [523,659,784,1047,1319,1568].forEach((f,i)=> tone(f, .28, "triangle", .085, i*.075));
  tone(196, .5, "sine", .06, 0);
}

// 歡快背景音樂（C 大調小循環）
const MEL  = [523,659,784,659, 587,784,988,784, 523,659,1047,880, 784,659,587,523];
const BASS = [131,131,165,165, 175,175,196,196, 131,131,165,165, 175,196,131,131];
function startMusic(){
  initAudio(); musicOn = true; mStep = 0;
  $("#musicBtn").textContent = "🎵 音樂：開";
  musicTimer = setInterval(()=>{
    if(!ac) return;
    const i = mStep % MEL.length;
    tone(MEL[i], .26, "triangle", .05, 0, musicGain);
    if(i % 2 === 0) tone(BASS[i], .34, "sine", .055, 0, musicGain);
    if(i % 4 === 2) tone(MEL[i]*2, .12, "sine", .022, .1, musicGain);
    mStep++;
  }, 250);
}
function stopMusic(){
  musicOn = false; clearInterval(musicTimer); musicTimer = null;
  $("#musicBtn").textContent = "🎵 開背景音樂";
}
$("#musicBtn").onclick = () => musicOn ? stopMusic() : startMusic();
$("#soundBtn").onclick = () => {
  soundOn = !soundOn;
  $("#soundBtn").textContent = soundOn ? "🔊 轉動音效：開" : "🔇 轉動音效：關";
};
$("#volume").oninput = e => { if(master) master.gain.value = e.target.value/100; };

/* ============================================================
   緩動：同 CSS cubic-bezier 一致，令「咔咔」聲跟住減速
   ============================================================ */
const EASE = [0.05, 0.55, 0.22, 1];           // 高速起步 → 逐漸變慢 → 精準停
const EASE_CSS = `cubic-bezier(${EASE.join(",")})`;
function bezY(t,p1,p2){ const u=1-t; return 3*u*u*t*p1 + 3*u*t*t*p2 + t*t*t; }
function easeT(progress){                      // 由進度反解時間
  let lo=0, hi=1;
  for(let i=0;i<32;i++){ const m=(lo+hi)/2; (bezY(m,EASE[1],EASE[3]) < progress) ? lo=m : hi=m; }
  return (lo+hi)/2;
}

/* ============================================================
   彩紙
   ============================================================ */
function confetti(count=90){
  const colors = ["#ff5c5c","#ffd166","#06d6a0","#4dabf7","#c77dff","#ff9f1c","#ef476f"];
  for(let i=0;i<count;i++){
    const c = document.createElement("i");
    c.className = "confetti";
    const w = 7 + Math.random()*8, h = 9 + Math.random()*14;
    c.style.cssText =
      `left:${Math.random()*100}vw;width:${w}px;height:${h}px;` +
      `background:${colors[i%colors.length]};` +
      `border-radius:${Math.random()<.35?"50%":"2px"};` +
      `--dx:${(Math.random()*260-130).toFixed(0)}px;--rot:${(Math.random()*1440-720).toFixed(0)}deg;` +
      `animation:fall ${(1.5+Math.random()*1.3).toFixed(2)}s cubic-bezier(.25,.6,.4,1) ${(Math.random()*.4).toFixed(2)}s forwards;`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 3400);
  }
}

/* ============================================================
   顯示結果（彈出 / 放大 / 回彈）
   ============================================================ */
function showResult(main, sub){
  const r = $("#result");
  r.textContent = main;
  $("#hint").textContent = sub;
  r.classList.remove("pop"); void r.offsetWidth; r.classList.add("pop");
  confetti(); winSound();
}

/* ============================================================
   轉動核心
   ============================================================ */
const DURATION = 5200;

function spin(labels, onDone){
  if(busy) return;
  busy = true;
  initAudio();
  $("#spin").disabled = true; $("#foodSpin").disabled = true;

  const n = labels.length, step = 360/n;
  const idx = Math.floor(Math.random()*n);
  drawWheel(labels);
  outer.classList.add("spinning");
  $("#hub").textContent = "🎲";
  $("#result").classList.remove("pop");
  $("#result").textContent = "🎡 轉緊…";
  $("#hint").textContent = "⚡ 高速起步，之後會慢慢減速";

  // 1) 反向蓄力
  rotor.style.transition = "transform 280ms cubic-bezier(.4,0,.7,1)";
  rotation -= 14;
  rotor.style.transform = `rotate(${rotation}deg)`;

  setTimeout(()=>{
    // 2) 主旋轉：精準停喺 idx 正中
    const turns = 6 + Math.floor(Math.random()*3);
    const cur = ((rotation % 360) + 360) % 360;
    const want = ((-(idx + 0.5) * step) % 360 + 360) % 360;
    const delta = ((want - cur) % 360 + 360) % 360;
    const total = turns*360 + delta;

    rotor.style.transition = `transform ${DURATION}ms ${EASE_CSS}`;
    rotation += total;
    rotor.style.transform = `rotate(${rotation}deg)`;

    // 3) 咔咔聲：每經過一格響一次，自然由密變疏
    const segs = Math.min(110, Math.round(total/step));
    let last = -999;
    for(let k=1;k<=segs;k++){
      const t = easeT(k/segs) * DURATION;
      if(t - last < 42) continue;
      last = t;
      setTimeout(tick, t);
    }

    // 4) 停定 → 結果動畫
    setTimeout(()=>{
      outer.classList.remove("spinning");
      $("#hub").textContent = "🍴";
      busy = false;
      onDone(idx);
    }, DURATION + 90);
  }, 300);
}

/* ============================================================
   第一輪：菜系   第二輪：料理
   ============================================================ */
$("#spin").onclick = () => {
  $("#stage").textContent = "第一輪 🎡 菜系輪盤";
  spin(cuisineLabels, idx => {
    picked = CUISINES[idx];
    showResult(picked.flag + " " + picked.name, "🎉 抽中咗呢個菜系！跟住抽一道料理");
    $("#spin").textContent = "🔁 重抽菜系";
    $("#spin").disabled = false;
    const f = $("#foodSpin");
    f.style.display = ""; f.disabled = false;
    f.textContent = "🍽️ 抽一道「" + picked.name + "」料理";
    $("#reset").style.display = "";
  });
};

$("#foodSpin").onclick = () => {
  if(!picked) return;
  $("#stage").textContent = "第二輪 🎡 料理輪盤 — " + picked.flag + " " + picked.name;
  spin(picked.dishes, idx => {
    const dish = picked.dishes[idx];
    showResult(dish, "🍽️ " + picked.flag + " " + picked.name + " — 今日就食呢道啦！");
    $("#spin").disabled = false; $("#foodSpin").disabled = false;
    $("#foodSpin").textContent = "🔁 再抽一道「" + picked.name + "」料理";
    addHistory(picked.flag + " " + picked.name + " → " + dish);
  });
};

$("#reset").onclick = () => {
  if(busy) return;
  picked = null;
  drawWheel(cuisineLabels);
  $("#stage").textContent = "第一輪 🎡 菜系輪盤";
  $("#result").textContent = "準備好未？";
  $("#hint").textContent = "㩒下面粒掣，先抽一個菜系";
  $("#spin").textContent = "🎡 抽菜系"; $("#spin").disabled = false;
  $("#foodSpin").style.display = "none";
  $("#reset").style.display = "none";
};

function addHistory(line){
  history.unshift(line);
  if(history.length > 8) history.pop();
  $("#history").style.display = "";
  $("#historyList").innerHTML = history.map(h => "<li>" + esc(h) + "</li>").join("");
}

// 鍵盤：空白鍵轉動
document.addEventListener("keydown", e => {
  if(e.code === "Space" && document.activeElement.id !== "title"){
    e.preventDefault();
    if(busy) return;
    (picked && $("#foodSpin").style.display !== "none") ? $("#foodSpin").click() : $("#spin").click();
  }
});
</script>
